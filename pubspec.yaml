name: loquiris
description: "Recording-first meeting recorder with optional remote transcription."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  clock: ^1.1.2
  crypto: ^3.0.7
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: ^0.20.2
  meta: ^1.17.0
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqlite3: ^3.5.2
  very_good_analysis: ^10.3.0
  xml: ^6.6.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/benchmarks/audio/manifest.json
    - assets/benchmarks/audio/zh_en_mixed_v1.wav
