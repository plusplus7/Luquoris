services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      LOQUIRIS_CLIENT_TOKENS: ${LOQUIRIS_CLIENT_TOKENS:?Set client tokens in .env}
      LOQUIRIS_ENABLED_PROFILES: ${LOQUIRIS_ENABLED_PROFILES:-qwen-1.7b}
      LOQUIRIS_RETENTION_SECONDS: ${LOQUIRIS_RETENTION_SECONDS:-86400}
      LOQUIRIS_STAGE_TIMEOUT_SECONDS: ${LOQUIRIS_STAGE_TIMEOUT_SECONDS:-3600}
    volumes:
      - data:/data
    expose:
      - '8000'
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      LOQUIRIS_CLIENT_TOKENS: ${LOQUIRIS_CLIENT_TOKENS:?Set client tokens in .env}
      LOQUIRIS_ENABLED_PROFILES: ${LOQUIRIS_ENABLED_PROFILES:-qwen-1.7b}
      LOQUIRIS_RETENTION_SECONDS: ${LOQUIRIS_RETENTION_SECONDS:-86400}
      LOQUIRIS_STAGE_TIMEOUT_SECONDS: ${LOQUIRIS_STAGE_TIMEOUT_SECONDS:-3600}
    volumes:
      - data:/data
      - models:/models:ro
    gpus: all
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  prepare:
    build:
      context: .
      target: worker
    profiles: [tools]
    entrypoint: [/app/.venv/bin/python, -m, loquiris_server.models]
    volumes:
      - models:/models
  proxy:
    image: caddy:2.10.0
    restart: unless-stopped
    environment:
      LOQUIRIS_SERVER_HOST: ${LOQUIRIS_SERVER_HOST:?Set server DNS name in .env}
    ports:
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  data:
  models:
  caddy_data:
  caddy_config:
